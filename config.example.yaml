# Copy this file to config.yaml and adapt the paths. Check it with `replica check --config config.yaml`, then read how it resolves with `replica explain --config config.yaml`.
# Paths must be absolute or start with ~, because the daemon's working directory under launchd is /.
# Roots must be disjoint across all relations. A root may not lie inside another root, nor may it contain the state directory or a log file.

# The state directory holds the database (state.db), the archive of overwritten and deleted content (blobs/), and the logs.
state: ~/scripts/replica/live
interval: 1m  # Time between full scans. Units: ms, s, m, h. Zero is rejected.
watch: true  # Run a cycle over a relation sooner when the filesystem reports a change under one of its roots.
debounce: 2s  # Quiet period after a change before that early cycle runs.
# gate: false  # Start with all writes held. Open the gate from the dashboard or with `replica gate open`.
ignore: ["**/.DS_Store", ".DS_Store"]  # Globs matched against the path below a replica's root. A matching file is left out of all relations.
archive: { cap: 100MB }  # Once the archive grows past this size, the oldest archived versions of the largest relation are evicted.
dashboard:
    port: 18516
    recent_events: 200
    # refresh: 10  # Seconds between dashboard refreshes.

# Variables are written ${name}. They expand in paths, patterns, flow statements, commands, and log paths.
# Path variables in braces, such as {name}, belong to patterns and are left alone.
vars:
    projects: ~/Desktop/Projects

# A profile is a bundle of relation fields. A relation lists its profiles under `profile`. The profile `_` applies to all relations.
# Later layers deep-merge over earlier ones: the `_` profile, then each listed profile, then the relation's own fields.
profiles:
    _:
        log: "${state}/logs/${relation}.log"  # ${relation} is the relation's name.
    two-way:
        flow: "source <-> dest [edit create]"  # Edits and new files travel both ways. A file deleted on either side is restored from the other.
    mirror:
        flow: "source -> dest [edit create delete]"  # Everything travels from source to dest. An edit made at dest is reverted.

relations:
    # A site is a pattern. A trailing slash means the whole tree below it: "~/Desktop/mylibrary/" is "~/Desktop/mylibrary/{path...}".
    # The variable {path...} appears on both sites, so it identifies a file across them.
    # `where` constrains variables. "*.js" keeps top-level JavaScript files. With "**/*.js" they are kept at any depth.
    mylibrary:
        profile: two-way
        sites:
            source: ~/Desktop/mylibrary/
            dest: ~/scripts/desktop-library/
        where: { path: "*.js" }
        # Edges carry kinds in brackets: edit, create, delete, or all. An arrow without brackets carries edit and create.
        # The relation's own flow replaces the profile's.
        flow: "source <-> dest [edit create]; source -> dest [delete]"  # A deletion at source deletes the file at dest. A deletion at dest is restored from source.
        resolve: "source mtime dest"  # The rules are tried in order. `a > b` prefers a. `a mtime b` prefers the newer file, `size` the larger file, and `name` the earlier name. On a tie, the next rule is tried.
        # sync_times: true  # Copy the modification time along with the content.
        # gate: false  # Hold this relation's writes from startup while planning and reporting continue.
        # watch: true

    # Two literal file paths relate two files, whatever they are called. With no variables there is exactly one key.
    nginx-default:
        profile: two-way
        sites:
            source: /etc/nginx/conf.d/default.conf
            dest: ~/Documents/nginx-conf.txt

    # A variable may appear anywhere in a path. {name} is on both sites here, so prose.md pairs with prose/SKILL.md.
    skills:
        profile: two-way
        sites:
            source: ~/scripts/skills/{name}.md
            dest: ~/.claude/skills/{name}/SKILL.md

    # A site may list several locations, or map names to them. Each becomes a replica with a stable identity.
    cursor-rules:
        sites:
            source: ~/scripts/styles/
            dest:
                alpha: ${projects}/alpha/.cursor/rules/
                beta: ${projects}/beta/.cursor/rules/
        where: { path: "*.mdc" }
        flow: "source <-> dest [edit create]; source -> dest [delete]"

    # A variable present on only one site fans that site out. Each cycle, the daemon lists the directories at the variable's position and makes a replica for each of them.
    # Fan-out variables are declared under `fanout`, so a typo in a variable name is an error rather than a silent fan-out.
    style-guide-all:
        profile: mirror
        sites:
            source: ~/scripts/rules/main_style.md
            dest: "${projects}/{project: [a-z]*}/docs/style/main_style.md"  # The constraint skips folders such as .git.
        fanout: [project]

    # An action runs a shell command when an event fires. A transform rewrites content as it travels along an edge.
    # When a command runs, ${key}, ${path}, ${replica}, ${site}, and ${op} are filled in. A transform reads ${in} and writes ${out}.
    site-styles:
        sites:
            src: ~/scripts/site/styles/{name}.scss
            out: ~/scripts/site/public/{name}.css
        flow: "src -> out [edit create delete]"
        transform:
            "src -> out": "sassc ${in} ${out}"
        on:
            changed: "touch ~/scripts/site/.rebuild"
            conflict: "osascript -e 'display notification \"${key}\" with title \"replica conflict in ${relation}\"'"
