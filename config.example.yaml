# Copy this file to config.yaml and adapt the paths. Check it with `replica check --config config.yaml`, then read how it resolves with `replica explain --config config.yaml`.
# Paths must be absolute or start with ~, because the daemon's working directory under launchd is /.
# Roots must be disjoint: no replica's root may lie inside another's, across all relations, and none may contain the state directory or a log file.

# The state directory holds the database (state.db), the archive of overwritten and deleted content (blobs/), the logs.
state: ~/scripts/replica/live
interval: 1m  # Full scan cadence. Units: ms, s, m, h. Zero is rejected.
watch: true  # Run a cycle over a relation sooner when the filesystem reports a change under one of its roots.
debounce: 2s  # Quiet period after a change before that early cycle runs.
# gate: false  # Start with every write held. Open the gate from the dashboard or with `replica gate open`.
ignore: ["**/.DS_Store", ".DS_Store"]  # Globs over the path below a replica's root; a matching file is left out of every relation.
archive: { cap: 100MB }  # Oldest archived versions of the largest relation are evicted past this size.
dashboard:
    port: 18516
    recent_events: 200
    # refresh: 10  # Seconds between dashboard refreshes.

# Variables are written ${name} and expand in paths, patterns, flow statements, commands, log paths.
# Path variables in braces, such as {name}, belong to patterns and are left alone.
vars:
    projects: ~/Desktop/Projects

# Profiles are bundles of relation fields. A relation lists profiles under `profile`; the profile `_` applies to all relations.
# Later layers deep-merge over earlier ones: the `_` profile, then each listed profile, then the relation's own fields.
profiles:
    _:
        log: "${state}/logs/${relation}.log"  # ${relation} is the relation's name.
    two-way:
        flow: "source <-> dest [edit create]"  # Edits travel both ways; new files and restored deletions travel both ways too.
    mirror:
        flow: "source -> dest [edit create delete]"  # Everything travels one way; edits made at dest are reverted.

relations:
    # A site is a pattern. A trailing slash means the whole tree below it: "~/Desktop/mylibrary/" is "~/Desktop/mylibrary/{path...}".
    # The variable {path...} appears on both sites, so it identifies a file across them.
    # `where` constrains variables: "*.js" keeps top-level JavaScript files; "**/*.js" would take them at any depth.
    mylibrary:
        profile: two-way
        sites:
            source: ~/Desktop/mylibrary/
            dest: ~/scripts/desktop-library/
        where: { path: "*.js" }
        # Edges carry kinds in brackets: edit, create, delete, or all. An arrow without brackets carries edit and create.
        # The relation's own flow replaces the profile's.
        flow: "source <-> dest [edit create]; source -> dest [delete]"  # Deletions at source delete at dest; deletions at dest are restored from source.
        resolve: "source mtime dest"  # Rules in order: `a > b` prefers a, `a mtime b` the newer file, `size` the larger, `name` the earlier name; a tie falls through.
        # sync_times: true  # Copy the modification time along with the content.
        # gate: false  # Hold this relation's writes from startup while planning and reporting continue.
        # watch: true

    # Two literal file paths relate two files, whatever their names. No variables means exactly one key.
    nginx-default:
        profile: two-way
        sites:
            source: /etc/nginx/conf.d/default.conf
            dest: ~/Documents/nginx-conf.txt

    # Variables may sit anywhere in a path. {name} appears on both sites, so prose.md pairs with prose/SKILL.md.
    skills:
        profile: two-way
        sites:
            source: ~/scripts/skills/{name}.md
            dest: ~/.claude/skills/{name}/SKILL.md

    # A site may list several locations, or map names to them. Each becomes a replica with a stable identity.
    cursor-rules:
        sites:
            source: ~/scripts/styles/
            dest:
                alpha: ${projects}/alpha/.cursor/rules/
                beta: ${projects}/beta/.cursor/rules/
        where: { path: "*.mdc" }
        flow: "source <-> dest [edit create]; source -> dest [delete]"

    # A variable on one site alone fans that site out: one replica per directory found at its position, discovered each cycle.
    # Fan-out variables are declared under `fanout`, so a typo in a variable name is an error rather than a silent fan-out.
    style-guide-all:
        profile: mirror
        sites:
            source: ~/scripts/rules/main_style.md
            dest: "${projects}/{project: [a-z]*}/docs/style/main_style.md"  # The constraint skips folders such as .git.
        fanout: [project]

    # Actions run shell commands on events; transforms rewrite content as it travels along an edge.
    # ${key}, ${path}, ${replica}, ${site}, ${op} are filled when the command runs; ${in} and ${out} are the transform's files.
    site-styles:
        sites:
            src: ~/scripts/site/styles/{name}.scss
            out: ~/scripts/site/public/{name}.css
        flow: "src -> out [edit create delete]"
        transform:
            "src -> out": "sassc ${in} ${out}"
        on:
            changed: "touch ~/scripts/site/.rebuild"
            conflict: "osascript -e 'display notification \"${key}\" with title \"replica conflict in ${relation}\"'"
