# Copy to config.yaml and adjust. All fields are shown; commented ones are defaults.

state_db: "~/scripts/replica/live/state.db"
interval: "1m"
dashboard:
    port: 18516
    recent_events: 200
    # refresh: 10           # seconds between dashboard refreshes

entries:
    # Defaults copied into every entry below that does not set the same field itself.
    # {name} expands to the entry's key; any other {field} expands to that entry's field.
    _:
        content: "bidirectional"
        log: "~/scripts/replica/live/logs/{name}.log"

    # Two-way sync of .js files between two folders.
    # An endpoint given as a bare string is a plain root folder.
    mylibrary:
        source: "~/Desktop/mylibrary"
        dest: "~/scripts/desktop-library"
        pattern: "*.js"
        # content: "bidirectional"    # or: "mirror(source)" for one-way
        # conflict: "skip"            # or: "newer", "prefer(source)"
        # on_new: "restrict"          # or: "replicate" to create missing copies
        # on_delete: "restore"        # or: "propagate", "skip"
        # sync_times: true

    # One file kept in step with a copy that has a different name.
    nginx-default:
        source: "/etc/nginx/conf.d"
        dest: { root: "~/Desktop", rename: "nginx-conf.txt" }

    # A whole-path template on each side.
    # Each {hole} matches one path component, and the hole values are the file's shared identity, so the two templates describe the same files under different layouts.
    skills:
        source: "~/scripts/skills/{name}.md"
        dest: "~/.claude/skills/{name}/SKILL.md"
        on_new: "replicate"

    # One file copied into every project folder, rediscovered each cycle.
    style-guide-all:
        source: "~/scripts/rules"
        dest:
            scan:
                template: "~/Desktop/Projects/{project}/docs/style"
                hole: "project"
                dir: "~/Desktop/Projects"
        pattern: "main_style.md"
        content: "mirror(source)"
        on_new: "replicate"
